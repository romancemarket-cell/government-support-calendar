<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b4a"><title>정부지원사업 달력</title>
<style>
:root{--navy:#142b4a;--blue:#2864dc;--bg:#f4f7fb;--line:#e4eaf2;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17243a;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.top{background:var(--navy);color:white;padding:22px max(18px,calc((100% - 1180px)/2))}.top h1{margin:0;font-size:24px}.top p{margin:7px 0 0;color:#d3deec;font-size:13px}.wrap{max-width:1180px;margin:22px auto;padding:0 16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.month{display:flex;align-items:center;gap:10px}.month strong{font-size:21px;min-width:130px;text-align:center}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 13px;cursor:pointer;font-size:14px}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 14px #142b4a08}.calendar{padding:14px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week div{text-align:center;color:var(--muted);font-size:12px;padding:9px 0}.day{min-height:105px;border:1px solid #edf1f6;border-radius:10px;padding:7px 6px;cursor:pointer;overflow:hidden}.day.dim{background:#fafbfd;color:#b5bfcc}.day.today{border-color:#85a9ff}.day.selected{background:#edf4ff;border:2px solid var(--blue);padding:6px 5px}.num{font-size:13px;font-weight:650}.event{display:block;margin-top:5px;padding:4px 5px;border-radius:5px;background:#eaf1ff;color:#234eaa;font-size:10px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.event.more{background:#f0f2f5;color:#667085}.detail{padding:18px;min-height:300px}.detail h2{font-size:18px;margin:0 0 6px}.sub{color:var(--muted);font-size:12px;margin-bottom:16px}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item h3{font-size:15px;line-height:1.4;margin:0 0 7px}.tag{display:inline-block;background:#eef3fb;color:#31517c;padding:4px 8px;border-radius:20px;font-size:11px;margin-right:5px}.meta{font-size:12px;color:#5f6c7d;line-height:1.65}.link{display:inline-block;color:var(--blue);font-size:13px;text-decoration:none;margin-top:7px;font-weight:600}.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}.foot{color:#8491a3;font-size:11px;text-align:right;margin:12px 2px}.mobile-hint{display:none}
@media(max-width:760px){.top{padding:18px}.top h1{font-size:20px}.wrap{margin:14px auto;padding:0 10px}.layout{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.day{min-height:76px;padding:5px 3px}.event{font-size:9px;padding:3px}.calendar{padding:8px}.week,.days{gap:3px}.detail{min-height:180px}.mobile-hint{display:block;color:var(--muted);font-size:11px;margin:0 0 8px}}
</style></head><body>
<header class="top"><h1>정부지원사업 달력</h1><p>전국 중앙부처·지자체 지원사업 공고를 한눈에 · 대출·융자 공고 제외</p></header>
<main class="wrap"><div class="toolbar"><div class="month"><button class="btn" id="prev">‹</button><strong id="label"></strong><button class="btn" id="next">›</button><button class="btn" id="today">오늘</button></div><div><button class="btn" id="all">전체 일정 보기</button></div></div>
<div class="layout"><section class="card calendar"><p class="mobile-hint">날짜를 누르면 해당 날짜의 지원사업을 확인할 수 있습니다.</p><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="days"></div></section><aside class="card detail" id="detail"><div class="empty">날짜를 선택하면 해당 날짜의 공고가 표시됩니다.</div></aside></div><div class="foot" id="updated">공고 데이터 확인 중…</div></main>
<script>
let programs=[],cursor=new Date();cursor=new Date(cursor.getFullYear(),cursor.getMonth(),1);let selected=new Date();
const $=id=>document.getElementById(id),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
async function load(){try{const r=await fetch('./data/programs.json?'+Date.now());const j=await r.json();programs=j.items||[];$('updated').textContent=`마지막 자동 수집: ${j.updated_at||'아직 수집 전'} · 실제 API 수집 데이터 ${programs.length}건`;}catch(e){$('updated').textContent='데이터 파일을 불러오지 못했습니다.';}render()}
function render(){const y=cursor.getFullYear(),m=cursor.getMonth();$('label').textContent=`${y}년 ${m+1}월`;const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=iso(new Date());let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),list=programs.filter(p=>p.end_date===key);html+=`<div class="day ${d.getMonth()!==m?'dim':''} ${key===today?'today':''} ${key===iso(selected)?'selected':''}" data-date="${key}"><div class="num">${d.getDate()}</div>${list.slice(0,2).map(p=>`<span class="event" title="${esc(p.title)}">${esc(p.title)}</span>`).join('')}${list.length>2?`<span class="event more">+${list.length-2}건 더보기</span>`:''}</div>`} $('days').innerHTML=html;document.querySelectorAll('.day').forEach(el=>el.onclick=()=>{selected=new Date(el.dataset.date+'T12:00:00');render();showDay(el.dataset.date)});}
function showDay(key){const list=programs.filter(p=>p.end_date===key);$('detail').innerHTML=`<h2>${key.replaceAll('-','.')} 마감 공고</h2><div class="sub">${list.length}건의 공고</div>`+(list.length?list.map(p=>`<div class="item"><h3>${esc(p.title)}</h3><span class="tag">${esc(p.category||'지원사업')}</span><span class="tag">${esc(p.region||'전국/지역')}</span><div class="meta">지원 대상: ${esc(p.target||'공고 원문 확인')}<br>접수 기간: ${esc(p.start_date||'미확인')} ~ ${esc(p.end_date||'미확인')}<br>지원 내용: ${esc(p.summary||'공고 원문 확인 필요')}</div><a class="link" href="${safeUrl(p.url)}" target="_blank" rel="noopener">공식 공고 원문 보기 ↗</a></div>`).join(''):'<div class="empty">이 날짜에 마감되는 수집 공고가 없습니다.</div>');}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeUrl(s){try{let u=new URL(s);return ['https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};$('today').onclick=()=>{cursor=new Date();cursor.setDate(1);selected=new Date();render();showDay(iso(selected))};$('all').onclick=()=>{$('detail').innerHTML='<h2>수집된 전체 공고</h2><div class="sub">마감일 기준 정렬</div>'+(programs.length?programs.slice().sort((a,b)=>(a.end_date||'').localeCompare(b.end_date||'')).map(p=>`<div class="item"><h3>${esc(p.title)}</h3><div class="meta">마감일: ${esc(p.end_date||'미확인')} · ${esc(p.region||'전국/지역')}</div><a class="link" href="${safeUrl(p.url)}" target="_blank">공식 공고 원문 보기 ↗</a></div>`).join(''):'<div class="empty">아직 수집된 공고가 없습니다. API 키를 설정하고 첫 수집을 실행하면 표시됩니다.</div>')};load();
</script></body></html>
