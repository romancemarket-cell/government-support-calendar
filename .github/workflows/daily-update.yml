name: Daily government support update
on:
  schedule:
    - cron: '0 18 * * *' # 03:00 KST daily
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official notices
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
        run: python scripts/collect.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/programs.json
          git diff --cached --quiet || git commit -m "Daily support program data update"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy site
        uses: actions/deploy-pages@v4
